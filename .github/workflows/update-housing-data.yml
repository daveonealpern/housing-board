name: Update housing data

on:
  schedule:
    # 03:37 UTC daily = ~8:37pm Pacific in summer, ~7:37pm in winter, the night before.
    # Set this early on purpose. GitHub starts scheduled runs late under load:
    # through October and November 2026 the old 13:07 UTC slot never ran on time and
    # started 3 to 10 hours late (between 16:19 and 22:57 UTC), so the board often
    # wasn't refreshed until midday Pacific. Starting at 03:37 UTC, a run that is that
    # late still finishes by about 5:30am Pacific. Off the :00 and :30 marks on purpose,
    # since on-the-hour slots compete with everyone else's jobs.
    - cron: "37 3 * * *"
  workflow_dispatch:        # adds a "Run workflow" button you can press any time

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # v5 and v6 run on Node 24. The older v4/v5 pair still works but emits a
      # deprecation warning on every run.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pull all sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # Optional. Without it the brief stays put and the sheet flags new filings.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch.py

      - name: Commit if anything changed
        run: |
          git config user.name  "housing-board-bot"
          git config user.email "actions@github.com"
          git add data.json brief.json
          git diff --staged --quiet || git commit -m "Housing data update $(date -u +'%Y-%m-%d')"
          git push
