<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Housing Signal Board</title>
<meta name="description" content="Public homebuilders, Southern California, construction costs and macro, from the Housing Signal Board.">
<meta name="theme-color" content="#2C3035">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Signal Board">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2C3035;
    --panel: #2F353A;
    --line: #3D4F58;
    --slate: #5C707B;
    --gold: #B8823A;
    --gold-light: #D4A865;
    --paper: #FAF8F5;
    --stone: #E8E2D9;
    --dim: #A9A49C;
    --worse: #E8A07E;
    --better: #9CC5B3;
    --tabbar: #262A2E;
    --display: 'Cinzel', Georgia, serif;
    --body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; padding: 0; background: var(--ink); }
  body { color: var(--paper); font-family: var(--body); -webkit-font-smoothing: antialiased; }
  a { color: var(--gold-light); }
  button { font-family: inherit; }
  .shell { max-width: 560px; margin: 0 auto; min-height: 100vh; }

  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 14px) 20px 14px;
    border-bottom: 1px solid var(--line);
  }
  .top img { height: 32px; width: auto; display: block; }
  .top-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; min-width: 0; }
  .top-name { font-family: var(--display); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone); white-space: nowrap; }
  .status {
    display: inline-flex; align-items: center; gap: 6px; min-height: 28px;
    font-size: 12px; color: var(--better); background: transparent;
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer;
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status.warn { color: var(--worse); }

  main { display: flex; flex-direction: column; gap: 28px; padding: 22px 20px calc(env(safe-area-inset-bottom) + 112px); }
  .eyebrow { margin: 0; font-family: var(--display); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-light); }
  h1.title { margin: 0; font-family: var(--display); font-weight: 500; font-size: 28px; letter-spacing: 0.04em; }
  .sec { display: flex; flex-direction: column; gap: 10px; }
  .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .sec-head h2, .sec > h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .sec-head span { font-size: 12px; color: var(--dim); text-align: right; }
  .note { margin: 0; font-size: 12px; color: var(--dim); line-height: 1.5; }
  .body-note { margin: 0; font-size: 13px; color: var(--stone); line-height: 1.5; }

  .card { background: var(--panel); border-radius: 4px; padding: 14px; }
  .card.accent { border-top: 2px solid var(--gold); }
  .lede { margin: 0; font-size: 16px; line-height: 1.5; font-weight: 500; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-size: 12px; color: var(--stone); background: var(--line); border-radius: 999px; padding: 4px 10px; }
  .chip.warn { color: var(--ink); background: var(--worse); }

  .summary { padding: 0; }
  .summary-head { padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  details.acc { border-top: 1px solid var(--line); }
  details.acc > summary {
    list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 52px; padding: 8px 16px; cursor: pointer;
  }
  details.acc > summary::-webkit-details-marker { display: none; }
  details.acc > summary .acc-t { display: flex; flex-direction: column; gap: 2px; font-size: 15px; font-weight: 600; }
  details.acc > summary .acc-t small { font-size: 12px; font-weight: 400; color: var(--dim); }
  details.acc > summary svg { flex-shrink: 0; transition: transform 0.15s ease; }
  details.acc[open] > summary svg { transform: rotate(90deg); }
  .acc-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .acc-body p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--stone); }

  .bar-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) 96px; align-items: center; gap: 10px; }
  .bar-row .lbl { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
  .bar-row .val { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .bar-row .val small { color: var(--dim); font-size: 11px; }
  .track { height: 10px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .fill { height: 10px; border-radius: 2px; }
  .cost-row { grid-template-columns: 124px minmax(0, 1fr) 64px; min-height: 28px; }
  .cost-row .lbl { font-size: 14px; font-weight: 400; }

  .score-head, .score-row { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 0.9fr); gap: 8px; }
  .score-head { padding: 0 2px 6px; border-bottom: 1px solid var(--line); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
  .score-row { align-items: center; min-height: 56px; padding: 6px 2px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--paper); }
  .score-row .who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .score-row .who b { font-size: 15px; font-weight: 600; }
  .score-row .who small { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score-row .mg small { font-size: 11px; color: var(--dim); line-height: 1.3; }
  .score-row .mg { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .num { font-size: 14px; font-variant-numeric: tabular-nums; }
  .r { text-align: right; }

  .signal { display: flex; gap: 14px; align-items: baseline; }
  .signal b { font-size: 18px; font-weight: 600; color: var(--gold-light); min-width: 78px; }
  .signal span { font-size: 14px; line-height: 1.45; }

  .list-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 46px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .list-row .k small { color: var(--dim); font-size: 12px; }
  .list-row .v { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .list-row .v small { font-size: 12px; }

  .stack-row { display: flex; flex-direction: column; gap: 3px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .stack-row .t { display: flex; justify-content: space-between; gap: 10px; }
  .stack-row .t b { font-size: 14px; font-weight: 600; }
  .stack-row .t span { font-size: 13px; white-space: nowrap; }
  .stack-row p { margin: 0; font-size: 13px; color: var(--stone); line-height: 1.45; }

  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .tile .k { font-size: 12px; color: var(--dim); }
  .tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .v.text { font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
  .tile .s { font-size: 12px; }
  .tile.wide { grid-column: span 2; }

  .resale { padding: 6px 14px; }
  .rs { display: grid; grid-template-columns: minmax(0, 1.15fr) repeat(3, minmax(0, 1fr)); gap: 6px; font-variant-numeric: tabular-nums; }
  .rs > span:not(:first-child) { text-align: right; }
  .rs.h { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--dim); }
  .rs.m { padding: 10px 0 2px; font-size: 14px; }
  .rs.m > span:first-child { color: var(--stone); font-size: 13px; }
  .rs.y { padding: 0 0 10px; font-size: 12px; border-bottom: 1px solid var(--line); }
  .rs.y > span:first-child { color: var(--dim); }
  .rs.one { padding: 10px 0; font-size: 14px; border-bottom: 1px solid var(--line); }
  .rs.one:last-child { border-bottom: 0; }
  .rs.one > span:first-child { color: var(--stone); font-size: 13px; }

  .watch { display: flex; flex-direction: column; gap: 6px; }
  .watch .k { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
  .watch.first .k { color: var(--gold-light); }
  .watch p { margin: 0; font-size: 14px; line-height: 1.5; }

  .back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding-right: 10px; color: var(--gold-light); text-decoration: none; font-size: 15px; margin: -10px 0 -14px; }
  .detail-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .px { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .px b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .spark { width: 100%; height: 56px; display: block; }
  .lots { display: flex; height: 14px; border-radius: 2px; overflow: hidden; }
  .hist { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .hist th { text-align: right; font-weight: 400; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--dim); padding: 0 0 6px; border-bottom: 1px solid var(--line); }
  .hist td { text-align: right; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .hist th:first-child, .hist td:first-child { text-align: left; }
  blockquote { margin: 0; padding: 2px 0 2px 14px; border-left: 2px solid var(--slate); font-size: 14px; line-height: 1.55; color: var(--stone); }
  .btn-line { display: flex; align-items: center; justify-content: center; min-height: 48px; border: 1px solid var(--gold); border-radius: 4px; text-decoration: none; font-size: 14px; font-weight: 600; color: var(--gold-light); }

  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--tabbar); border-top: 1px solid var(--line);
    padding: 8px 8px calc(env(safe-area-inset-bottom) + 8px);
  }
  .tabs-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; text-decoration: none; color: var(--dim); font-size: 11px; }
  .tabs a[aria-current="page"] { color: var(--gold-light); font-weight: 600; }
  .loading { padding: 60px 20px; text-align: center; color: var(--dim); font-size: 14px; }
  .worse { color: var(--worse); } .better { color: var(--better); } .flat { color: var(--stone); } .mid { color: var(--gold-light); } .dim { color: var(--dim); }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a href="#builders" aria-label="Colton Lee Communities, Housing Signal Board home"><img src="clc-logo.png" alt="Colton Lee Communities" width="140" height="32"></a>
    <div class="top-meta">
      <span class="top-name">Housing Signal Board</span>
      <button type="button" class="status" id="status" aria-live="polite"><span class="dot"></span><span id="status-text">Loading</span></button>
    </div>
  </header>
  <main id="view"><div class="loading">Loading the latest data&hellip;</div></main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-inner">
    <a href="#builders" data-tab="builders">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>Builders</a>
    <a href="#socal" data-tab="socal">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>SoCal</a>
    <a href="#costs" data-tab="costs">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/></svg>Costs</a>
    <a href="#macro" data-tab="macro">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Macro</a>
  </div>
</nav>

<!-- The board's own trend and summary functions, shared so the app and the
     board always say the same thing. They read the global D declared below. -->
<script src="../summary.js"></script>
<script>
"use strict";
let D = null;
let loadedAt = 0;
const view = document.getElementById('view');

// ---------------------------------------------------------------- formatting
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MINUS = '−';
function compact(v){
  const a = Math.abs(v);
  if(a >= 1e9) return (v/1e9).toFixed(a >= 1e11 ? 0 : 2) + 'B';
  if(a >= 1e6) return (v/1e6).toFixed(2) + 'M';
  if(a >= 1e4) return Math.round(v/1e3) + 'K';
  return Math.round(v).toLocaleString('en-US');
}
function signed(v, dp){ return (v >= 0 ? '+' : MINUS) + Math.abs(v).toFixed(dp == null ? 1 : dp) + '%'; }
function arrow(v, dp){ return (v > 0 ? '▲ ' : v < 0 ? '▼ ' : '') + Math.abs(v).toFixed(dp == null ? 1 : dp) + '%'; }
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function d8(iso){ return new Date(iso + 'T12:00:00'); }
function shortDate(iso){ const d = d8(iso); return MONTHS[d.getMonth()] + ' ' + d.getDate(); }
function periodLabel(s, iso){
  const d = d8(iso), f = (s.frequency || '').toLowerCase();
  if(f.startsWith('quarterly')) return 'Q' + (Math.floor(d.getMonth()/3) + 1);
  if(f.startsWith('daily') || f.startsWith('weekly')) return shortDate(iso);
  return MONTHS[d.getMonth()];
}
function toneOf(id){
  const s = D.series[id];
  if(!s) return 'flat';
  const h = health(s);
  return h === 'up' ? 'better' : h === 'down' ? 'worse' : 'flat';
}
function yearAgo(obs){
  if(!obs || !obs.length) return null;
  return obsBefore(obs, shiftYears(obs[obs.length-1].d, -1));
}

// Display rules for each series the app shows. delta: 'pct' (year-over-year
// percent change) or 'was' (the value a year ago).
const SERIES = {
  HOUST1F:       {label: 'Single-family starts', f: compact},
  PERMIT1:       {label: 'Single-family permits', f: compact},
  HSN1F:         {label: 'New home sales', f: compact},
  MSACSR:        {label: 'New-home supply', f: v => v.toFixed(1) + ' mo', delta: 'was'},
  EXHOSLUSM495S: {label: 'Existing home sales', f: compact},
  PRRESCONS:     {label: 'Residential construction spend', f: v => '$' + compact(v)},
  UMCSENT:       {label: 'Consumer sentiment', f: v => v.toFixed(1)},
  DRSFRMACBS:    {label: 'Mortgage delinquency', f: v => v.toFixed(2) + '%', delta: 'was'},
  CABPPRIV:      {label: 'Building permits', f: v => Math.round(v).toLocaleString('en-US')},
  LXXRSA:        {label: 'L.A. home prices', sub: 'Case-Shiller', f: null},
  CASTHPI:       {label: 'California home prices', sub: 'FHFA', f: null},
  CAUR:          {label: 'Unemployment', f: v => v.toFixed(1) + '%', delta: 'was'},
};
function seriesRow(id){
  const s = D.series[id], cfg = SERIES[id];
  if(!s || !s.obs || !s.obs.length) return '';
  const last = s.obs[s.obs.length-1], ya = yearAgo(s.obs), t = trend(s.obs), tone = toneOf(id);
  let delta = '';
  if(cfg.delta === 'was' && ya) delta = 'was ' + cfg.f(ya.v);
  else if(t.pct != null) delta = arrow(t.pct);
  const label = esc(cfg.label) + ' <small>' + esc(cfg.sub ? cfg.sub + ', ' : '') + esc(periodLabel(s, last.d)) + '</small>';
  const value = cfg.f ? esc(cfg.f(last.v)) + (delta ? ' <small class="' + tone + '">' + esc(delta) + '</small>' : '')
                      : '<span class="' + tone + '">' + esc(t.pct != null ? signed(t.pct) : '') + '</span> <small class="dim">yr</small>';
  return '<div class="list-row"><span class="k">' + label + '</span><span class="v">' + value + '</span></div>';
}

// ------------------------------------------------------------------ calendar
const RELEASE_NAMES = {
  'New Residential Construction': 'Housing starts',
  'Primary Mortgage Market Survey': 'Weekly mortgage rates',
  'House Price Index': 'FHFA home prices',
  'S&P Cotality Case-Shiller Home Price Indices': 'Case-Shiller home prices',
  'Housing Units Authorized By Building Permits': 'Building permits by state',
  'New Residential Sales': 'New home sales',
  'Existing Home Sales': 'Existing home sales',
  'Surveys of Consumers': 'Consumer sentiment',
  'State Employment and Unemployment': 'California unemployment',
  'Producer Price Index': 'Producer prices',
  'Construction Spending': 'Construction spending',
  'Job Openings and Labor Turnover Survey': 'Job openings',
  'Employment Situation': 'Jobs report',
  'Spot Prices': 'Oil prices',
};
const MACRO_RELEASES = ['New Residential Construction','Primary Mortgage Market Survey','House Price Index','S&P Cotality Case-Shiller Home Price Indices','New Residential Sales','Existing Home Sales','Surveys of Consumers','State Employment and Unemployment'];
const COST_RELEASES = ['Producer Price Index','Construction Spending','Job Openings and Labor Turnover Survey','Employment Situation','Spot Prices'];
function upcoming(names, n){
  const seen = new Set(), rows = [];
  const today = new Date(); today.setHours(12, 0, 0, 0);
  (D.calendar || []).filter(c => names.includes(c.name)).forEach(c => {
    const label = RELEASE_NAMES[c.name] || c.name, key = label + c.date;
    const days = Math.round((d8(c.date) - today) / 864e5);
    if(days < 0 || seen.has(key)) return; seen.add(key);
    rows.push({label, date: c.date, days});
  });
  rows.sort((a, b) => a.days - b.days);
  if(!rows.length) return '';
  return '<section class="sec"><h2>Coming up</h2><div>' + rows.slice(0, n || 5).map((r, i) =>
    '<div class="list-row"><span>' + esc(r.label) + '</span><span class="' + (i === 0 ? 'mid' : 'dim') + '">'
    + (r.days === 0 ? 'Today' : r.days === 1 ? 'Tomorrow' : esc(shortDate(r.date))) + '</span></div>').join('') + '</div></section>';
}

// ------------------------------------------------------------------ builders
const SHORT = {DHI:'D.R. Horton', LEN:'Lennar', PHM:'PulteGroup', KBH:'KB Home', TOL:'Toll Brothers', NVR:'NVR',
               MTH:'Meritage', CCS:'Century', MHO:'M/I Homes', LGIH:'LGI Homes'};
const ALIASES = {DHI:['Horton'], LEN:['Lennar'], PHM:['Pulte'], KBH:['KB'], TOL:['Toll'], NVR:['NVR'],
                 MTH:['Meritage'], CCS:['Century'], MHO:['M/I'], LGIH:['LGI']};
function firstPct(s){ const m = String(s || '').match(/([+\-−]?\d+(?:\.\d+)?)%/); return m ? parseFloat(m[1].replace(MINUS, '-')) : null; }
function quarterMonth(q){ return String(q || '').split(' ')[0]; }
function builderRows(){
  const hist = (D.brief && D.brief.metric_history) || {};
  return ((D.brief && D.brief.metrics) || []).map(m => {
    const stock = (D.stocks || []).find(s => s.ticker === m.ticker) || {};
    const paren = String(m.orders || '').match(/\(([^)]*)\)/);
    const ordTxt = paren ? paren[1] : String(m.orders || '');
    let orders = {txt: '—', tone: 'flat'};
    if(/flat/i.test(ordTxt)) orders = {txt: 'flat', tone: 'flat'};
    else { const v = firstPct(ordTxt); if(v != null) orders = {txt: arrow(v, 0) + (/YTD/i.test(ordTxt) ? ' YTD' : ''), tone: v < 0 ? 'worse' : v > 0 ? 'better' : 'flat'}; }
    const mv = firstPct(m.margin);
    let msub = String(m.margin || '').replace(/^\s*\d+(?:\.\d+)?%\s*/, '').replace(/[()]/g, '').trim();
    if(msub === 'adj') msub = 'adjusted';
    const h = hist[m.ticker] || [];
    if(!msub && h.length >= 2 && h[h.length-2].margin_pct != null) msub = 'prev qtr ' + Number(h[h.length-2].margin_pct).toFixed(1) + '%';
    const cv = firstPct(m.cancels);
    return {t: m.ticker, name: SHORT[m.ticker] || m.name, q: quarterMonth(m.quarter), orders, margin: mv, msub,
            cancel: cv, cancelYtd: /YTD/i.test(m.cancels || ''), stock: stock.ytd_pct, m};
  });
}
function modeMonth(rows){
  const c = {}; rows.forEach(r => c[r.q] = (c[r.q] || 0) + 1);
  return Object.keys(c).sort((a, b) => c[b] - c[a])[0];
}

function renderBuilders(){
  const b = D.brief || {}, app = b.app || {};
  const sig = computeExecSignals(), pitch = execPitch(sig), paras = execSummary(sig);
  const rows = builderRows(), mode = modeMonth(rows);
  const chevron = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4A865" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  const acc = (title, sub, ps, foot) => ps && ps.length ? '<details class="acc"><summary><span class="acc-t">' + esc(title) + '<small>' + esc(sub) + '</small></span>' + chevron + '</summary><div class="acc-body">'
    + ps.map(p => '<p>' + esc(p) + '</p>').join('') + (foot ? '<p class="note">' + esc(foot) + '</p>' : '') + '</div></details>' : '';

  let h = '<section class="card accent summary" aria-label="Market summary"><div class="summary-head">'
    + '<div class="sec-head"><p class="eyebrow">Market summary</p><span>' + esc(shortDate(D.generated.slice(0, 10))) + '</span></div>'
    + '<p class="lede">' + esc(pitch) + '</p></div>'
    + acc('Executive summary', 'Indicators, rates, resale, builder stocks', paras, 'Computed fresh from this run')
    + acc('California and the West', "Each builder's western segment", b.socal)
    + acc('Ventura County', 'Resale, pipeline, regulatory', b.ventura)
    + '</section>';

  const chips = [];
  if(b.as_of) chips.push('<span class="chip">Brief updated ' + esc(shortDate(b.as_of)) + '</span>');
  if((b.stale || []).length) chips.push('<span class="chip warn">' + b.stale.length + ' new filing' + (b.stale.length > 1 ? 's' : '') + ' to read</span>');
  if((app.next_filings || []).length) chips.push('<span class="chip">Next: ' + esc(app.next_filings[0].name.replace(/ annual report$/, '') + ', ' + app.next_filings[0].when) + '</span>');
  h += '<section class="sec"><p class="eyebrow">Public builders</p><h1 class="title">Builders</h1>' + (chips.length ? '<div class="chips">' + chips.join('') + '</div>' : '') + '</section>';

  const cr = rows.filter(r => r.cancel != null).sort((a, b) => b.cancel - a.cancel);
  if(cr.length){
    const max = Math.max(50, cr[0].cancel);
    const nd = rows.filter(r => r.cancel == null).map(r => r.name), ytd = cr.filter(r => r.cancelYtd).map(r => r.name);
    h += '<section class="sec"><div class="sec-head"><h2>Cancellation rate</h2><span>Latest quarter · higher is worse</span></div><div class="sec" style="gap:10px">'
      + cr.map(r => {
          const tone = r.cancel >= 18 ? 'worse' : r.cancel >= 10 ? 'mid' : 'better';
          const color = tone === 'worse' ? 'var(--worse)' : tone === 'mid' ? 'var(--gold-light)' : 'var(--better)';
          const note = r.cancelYtd ? 'YTD' : (r.q !== mode ? r.q : '');
          return '<div class="bar-row"><span class="lbl">' + esc(r.t) + '</span><div class="track"><div class="fill" style="width:' + (r.cancel / max * 100).toFixed(1) + '%;background:' + color + '"></div></div><span class="val">' + r.cancel + '% <small>' + esc(note) + '</small></span></div>';
        }).join('') + '</div>'
      + '<p class="note">' + [ytd.length ? ytd.join(' and ') + (ytd.length > 1 ? ' report' : ' reports') + ' a year-to-date rate.' : '', nd.length ? nd.join(' and ') + (nd.length > 1 ? ' do' : ' does') + ' not disclose a rate.' : '', 'Quarters differ by fiscal year; the month shows where a builder is off the usual calendar.'].filter(Boolean).join(' ') + '</p></section>';
  }

  const sr = rows.slice().sort((a, b) => (b.margin || 0) - (a.margin || 0));
  h += '<section class="sec" id="scorecard" style="gap:4px"><div class="sec-head" style="margin-bottom:8px"><h2>Scorecard</h2><span>Sorted by gross margin</span></div>'
    + '<div class="score-head"><span>Builder</span><span>Orders</span><span>Margin</span><span class="r">Stock</span></div>'
    + sr.map(r => '<a class="score-row" href="#b/' + esc(r.t) + '"><span class="who"><b>' + esc(r.t) + '</b><small>' + esc(r.name) + ' · ' + esc(r.q) + '</small></span>'
        + '<span class="num ' + r.orders.tone + '">' + esc(r.orders.txt) + '</span>'
        + '<span class="mg"><span class="num">' + (r.margin != null ? r.margin.toFixed(1) + '%' : '—') + '</span><small>' + esc(r.msub) + '</small></span>'
        + '<span class="num r ' + (r.stock == null ? 'flat' : r.stock >= 0 ? 'better' : 'worse') + '">' + (r.stock == null ? '—' : signed(r.stock)) + '</span></a>').join('')
    + '<p class="note" style="margin-top:8px">Orders are net orders versus the same quarter last year. Stock is year to date. Tap a builder for its filing.</p></section>';

  if((app.signals || []).length){
    h += '<section class="sec"><h2>Land and balance sheet</h2>' + app.signals.map(s => '<div class="card signal"><b>' + esc(s.value) + '</b><span>' + esc(s.text) + '</span></div>').join('') + '</section>';
  }
  if((app.next_filings || []).length){
    h += '<section class="sec" style="gap:4px"><h2 style="margin-bottom:6px">Next filings</h2>' + app.next_filings.map((f, i) => '<div class="list-row"><span>' + esc(f.name) + '</span><span class="' + (i === 0 ? 'mid' : 'dim') + '">' + esc(f.when) + '</span></div>').join('') + '</section>';
  }
  h += '<a class="btn-line" href="../">Open the full board</a>';
  return h;
}

function spark(series){
  const pts = (series || []).slice(-250);
  if(pts.length < 2) return '';
  const vs = pts.map(p => p.v), mn = Math.min(...vs), mx = Math.max(...vs), W = 350, H = 56;
  const d = pts.map((p, i) => (i ? 'L' : 'M') + (i / (pts.length - 1) * W).toFixed(1) + ',' + (H - 4 - (mx === mn ? 0.5 : (p.v - mn) / (mx - mn)) * (H - 8)).toFixed(1)).join('');
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Share price over the past year"><path d="' + d + '" fill="none" stroke="#D4A865" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>';
}

function renderBuilder(tk){
  const b = D.brief || {};
  const m = (b.metrics || []).find(x => x.ticker === tk);
  if(!m) return '<a class="back" href="#builders">‹ Builders</a><p class="body-note">No filing data for ' + esc(tk) + ' yet.</p>';
  const stock = (D.stocks || []).find(s => s.ticker === tk) || {};
  const filing = (D.builders || []).find(x => x.ticker === tk) || {};
  const hist = ((b.metric_history || {})[tk] || []).slice().reverse();
  const back = '<a class="back" href="#builders"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Builders</a>';
  let h = back + '<section class="detail-head"><div class="sec" style="gap:6px"><p class="eyebrow">' + esc(tk) + ' · quarter ended ' + esc(m.quarter || '') + '</p><h1 class="title">' + esc(m.name) + '</h1></div>'
    + (stock.price != null ? '<div class="px"><b>$' + stock.price.toFixed(2) + '</b><span class="note ' + (stock.ytd_pct >= 0 ? 'better' : 'worse') + '">' + signed(stock.ytd_pct) + ' this year</span></div>' : '') + '</section>';
  if(stock.series) h += spark(stock.series);

  const tiles = [['Deliveries', m.deliveries], ['Net orders', m.orders], ['Gross margin', m.margin], ['Cancellation rate', m.cancels], ['Communities', m.communities], ['Incentives', m.incentives]]
    .filter(t => t[1]);
  h += '<section class="tiles">' + tiles.map(t => '<div class="tile"><span class="k">' + esc(t[0]) + '</span><span class="v text">' + esc(t[1]) + '</span></div>').join('') + '</section>';

  const num = s => { const t = String(s || '').replace(/,/g, '').trim(); return /^\d+$/.test(t) ? parseInt(t, 10) : null; };
  const own = num(m.lots_owned), opt = num(m.lots_optioned);
  if(own != null && opt != null){
    const tot = own + opt, po = Math.round(own / tot * 100);
    h += '<section class="sec"><div class="sec-head"><h2>Lots controlled</h2><span class="num" style="color:var(--paper)">' + tot.toLocaleString('en-US') + '</span></div>'
      + '<div class="lots" role="img" aria-label="' + po + ' percent owned, ' + (100 - po) + ' percent optioned"><div style="width:' + po + '%;background:var(--gold)"></div><div style="width:' + (100 - po) + '%;background:var(--slate)"></div></div>'
      + '<div class="sec-head" style="font-size:12px"><span style="text-align:left;color:var(--paper)"><span class="mid">■</span> Owned ' + own.toLocaleString('en-US') + ' (' + po + '%)</span><span style="color:var(--paper)"><span style="color:#8FA3AD">■</span> Optioned ' + opt.toLocaleString('en-US') + ' (' + (100 - po) + '%)</span></div></section>';
  } else if(m.lots_owned || m.lots_optioned){
    h += '<section class="sec" style="gap:4px"><h2 style="margin-bottom:6px">Lots</h2>'
      + (m.lots_owned ? '<div class="list-row"><span>Owned</span><span class="v">' + esc(m.lots_owned) + '</span></div>' : '')
      + (m.lots_optioned ? '<div class="list-row"><span>Optioned or controlled</span><span class="v">' + esc(m.lots_optioned) + '</span></div>' : '') + '</section>';
  }

  if(hist.length >= 2){
    const f = (v, s) => v == null ? '—' : (s ? signed(v, 1) : v + '%');
    h += '<section class="sec"><h2>Quarter by quarter</h2><table class="hist"><thead><tr><th>Quarter</th><th>Orders</th><th>Margin</th><th>Cancels</th></tr></thead><tbody>'
      + hist.map(x => '<tr><td>' + esc(shortDate(x.quarter).split(' ')[0] + ' ' + x.quarter.slice(0, 4)) + '</td><td>' + f(x.orders_yoy_pct, true) + '</td><td>' + f(x.margin_pct) + '</td><td>' + f(x.cancel_rate_pct) + '</td></tr>').join('')
      + '</tbody></table></section>';
  }

  // Only the sentences of the brief that name this builder; most paragraphs
  // cover several builders, so whole paragraphs would repeat the Builders tab.
  const names = ALIASES[tk] || [m.name];
  const rx = new RegExp('(^|[^A-Za-z/])(' + names.map(n => n.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&')).join('|') + ')(?![A-Za-z])');
  const seen = new Set(), sents = [];
  [].concat(b.national || [], b.land || [], b.socal || [], b.takeaway || []).forEach(p => {
    String(p).split(/(?<=[.!?])\s+(?=[A-Z(])/).forEach(x => {
      const t = x.trim();
      if(rx.test(t) && !seen.has(t)){ seen.add(t); sents.push(t); }
    });
  });
  // Sentences about this builder first, then group comparisons that include it.
  const lead = t => names.some(n => t.startsWith(n)) ? 1 : 0;
  sents.sort((a, b) => lead(b) - lead(a));
  if(sents.length){
    h += '<section class="sec"><h2>In the brief</h2>' + sents.slice(0, 8).map(t => '<blockquote>' + esc(t) + '</blockquote>').join('') + '</section>';
  }
  if(filing.url){
    h += '<a class="btn-line" href="' + esc(filing.url) + '" target="_blank" rel="noopener">Read the ' + esc(filing.form || 'filing') + ' on SEC.gov</a>'
      + (filing.filed ? '<p class="note" style="text-align:center;margin-top:-18px">Filed ' + esc(shortDate(filing.filed)) + '</p>' : '');
  }
  return h;
}

function renderSoCal(){
  const b = D.brief || {}, app = b.app || {};
  const levels = {}; ((D.resale && D.resale.levels) || []).forEach(l => levels[l.key] = l);
  const order = [['ventura', 'Ventura'], ['ca', 'Calif.'], ['national', 'U.S.']].filter(x => levels[x[0]]);
  let h = '<section class="sec" style="gap:6px"><p class="eyebrow">Southern California</p><h1 class="title">SoCal</h1></section>';
  if(order.length){
    const lastOf = (l, k) => { const o = l[k] || []; return o.length ? o[o.length-1] : null; };
    const yoy = (l, k) => { const t = trend(l[k] || []); return t.pct; };
    const month = lastOf(levels[order[0][0]], 'median_price');
    const cell = (i, v) => '<span' + (i === 0 ? ' style="font-weight:600"' : '') + '>' + v + '</span>';
    const yrow = k => '<div class="rs y"><span>vs last year</span>' + order.map(x => { const p = yoy(levels[x[0]], k); return '<span class="' + (p == null ? 'dim' : k === 'homes_sold' ? (p < 0 ? 'worse' : 'better') : 'flat') + '">' + (p == null ? '—' : (k === 'homes_sold' ? arrow(p) : signed(p))) + '</span>'; }).join('') + '</div>';
    h += '<section class="sec"><div class="sec-head"><h2>Resale market</h2><span>Redfin · ' + esc(month ? MONTHS[d8(month.d).getMonth()] : '') + '</span></div><div class="card resale">'
      + '<div class="rs h"><span></span>' + order.map((x, i) => '<span' + (i === 0 ? ' class="mid"' : '') + '>' + x[1] + '</span>').join('') + '</div>'
      + '<div class="rs m"><span>Median price</span>' + order.map((x, i) => { const v = lastOf(levels[x[0]], 'median_price'); return cell(i, v ? '$' + Math.round(v.v / 1000) + 'K' : '—'); }).join('') + '</div>' + yrow('median_price')
      + '<div class="rs m"><span>Homes sold</span>' + order.map((x, i) => { const v = lastOf(levels[x[0]], 'homes_sold'); return cell(i, v ? Math.round(v.v).toLocaleString('en-US') : '—'); }).join('') + '</div>' + yrow('homes_sold')
      + '<div class="rs one"><span>Days on market</span>' + order.map((x, i) => { const v = lastOf(levels[x[0]], 'dom'); return cell(i, v ? Math.round(v.v) : '—'); }).join('') + '</div>'
      + '<div class="rs one"><span>Sale to list</span>' + order.map((x, i) => { const v = lastOf(levels[x[0]], 'sale_to_list'); return cell(i, v ? v.v.toFixed(1) + '%' : '—'); }).join('') + '</div>'
      + '</div>';
    const ps = order.map(x => yoy(levels[x[0]], 'median_price')).filter(v => v != null);
    const ss = order.map(x => yoy(levels[x[0]], 'homes_sold')).filter(v => v != null);
    if(ps.length && ss.length){
      const pr = ps.every(v => Math.abs(v) < 2) ? 'Prices are holding' : ps.every(v => v > 0) ? 'Prices are rising' : ps.every(v => v < 0) ? 'Prices are falling' : 'Prices are mixed';
      const lo = Math.min(...ss.map(Math.abs)).toFixed(0), hi = Math.max(...ss.map(Math.abs)).toFixed(0);
      const sv = ss.every(v => v < -2) ? 'sales are down ' + (lo === hi ? lo : lo + '% to ' + hi) + '% at every level' : ss.every(v => v > 2) ? 'sales are up ' + (lo === hi ? lo : lo + '% to ' + hi) + '% at every level' : 'sales are mixed';
      h += '<p class="note">' + pr + '; ' + sv + '.</p>';
    }
    h += '</section>';
  }
  if((app.west || []).length){
    h += '<section class="sec" style="gap:4px"><div class="sec-head" style="margin-bottom:6px"><h2>Builders in the West</h2><span>Latest segment results</span></div>'
      + app.west.map(w => '<div class="stack-row"><div class="t"><b>' + esc(w.name) + '</b><span class="' + (w.tone === 'better' ? 'better' : w.tone === 'worse' ? 'worse' : 'flat') + '">' + esc(w.stat) + '</span></div><p>' + esc(w.text) + '</p></div>').join('') + '</section>';
  }
  h += '<section class="sec" style="gap:4px"><h2 style="margin-bottom:6px">California indicators</h2>' + ['CABPPRIV', 'LXXRSA', 'CASTHPI', 'CAUR'].map(seriesRow).join('') + '</section>';
  if((app.watch || []).length){
    h += '<section class="sec"><h2>Regulatory and market watch</h2>' + app.watch.map((w, i) => '<div class="card watch' + (i === 0 ? ' accent first' : '') + '"><span class="k">' + esc(w.label) + '</span><p>' + esc(w.text) + '</p></div>').join('') + '</section>';
  }
  return h;
}

function renderCosts(){
  const app = (D.brief && D.brief.app) || {};
  const pctOf = id => { const s = D.series[id]; return s ? trend(s.obs).pct : null; };
  const mats = [['WPUSI019011', 'Copper'], ['WPU101704', 'Structural steel'], ['WPUSI012011', 'All materials'], ['WPU081', 'Lumber']]
    .map(([id, label]) => ({id, label, p: pctOf(id)})).filter(x => x.p != null).sort((a, b) => b.p - a.p);
  let h = '<section class="sec" style="gap:6px"><p class="eyebrow">Materials, energy, labor</p><h1 class="title">Costs</h1></section>';
  const all = pctOf('WPUSI012011'), jobs = pctOf('JTS2300JOL');
  const leaders = mats.filter(x => x.id !== 'WPUSI012011').slice(0, 2);
  if(all != null){
    let lede = 'Construction material prices are ' + (all >= 0 ? 'up ' : 'down ') + Math.abs(all).toFixed(0) + '% on the year'
      + (leaders.length === 2 && leaders[0].p > all ? ', led by ' + leaders[0].label.toLowerCase() + ' and ' + leaders[1].label.toLowerCase() : '')
      + (jobs != null ? ', and construction job openings are ' + (jobs >= 0 ? 'up ' : 'down ') + Math.abs(jobs).toFixed(0) + '%' : '') + '.';
    h += '<section class="card accent sec" style="gap:8px"><p class="lede">' + esc(lede) + '</p>' + (app.cost_summary ? '<p class="body-note">' + esc(app.cost_summary) + '</p>' : '') + '</section>';
  }
  if(mats.length){
    const max = Math.max(50, ...mats.map(x => Math.abs(x.p)));
    const last = D.series['WPUSI012011'] ? D.series['WPUSI012011'].obs.slice(-1)[0] : null;
    h += '<section class="sec" style="gap:12px"><div class="sec-head"><h2>Materials</h2><span>Producer prices' + (last ? ' · ' + MONTHS[d8(last.d).getMonth()] : '') + ', vs last year</span></div>'
      + mats.map(x => { const tone = toneOf(x.id), color = tone === 'worse' ? (x.p >= 12 ? 'var(--worse)' : 'var(--gold-light)') : tone === 'better' ? 'var(--better)' : 'var(--stone)';
          return '<div class="bar-row cost-row"><span class="lbl">' + esc(x.label) + '</span><div class="track"><div class="fill" style="width:' + (Math.abs(x.p) / max * 100).toFixed(1) + '%;background:' + color + '"></div></div><span class="val" style="font-size:14px;color:' + color + '">' + signed(x.p) + '</span></div>'; }).join('') + '</section>';
  }
  const tile = (id, label, f, wide, costTone) => {
    const s = D.series[id]; if(!s || !s.obs.length) return '';
    const last = s.obs[s.obs.length-1], t = trend(s.obs);
    const tone = costTone ? (t.dir === 'up' ? 'mid' : t.dir === 'down' ? 'better' : 'flat') : toneOf(id);
    return '<div class="tile' + (wide ? ' wide' : '') + '"><span class="k">' + esc(label) + ' · ' + esc(periodLabel(s, last.d)) + '</span><span class="v">' + esc(f(last.v)) + '</span>'
      + (t.pct != null ? '<span class="s ' + tone + '">' + arrow(t.pct, 0) + ' vs last year</span>' : '') + '</div>';
  };
  h += '<section class="tiles">' + tile('DCOILWTICO', 'Crude oil, WTI', v => '$' + v.toFixed(2)) + tile('JTS2300JOL', 'Construction openings', compact, false, true) + tile('USCONS', 'Construction employment', compact, true) + '</section>';
  if((app.cost_notes || []).length){
    h += '<section class="sec" style="gap:4px"><h2 style="margin-bottom:6px">What the builders say</h2>' + app.cost_notes.map(n => '<div class="stack-row"><div class="t"><b>' + esc(n.who) + '</b></div><p>' + esc(n.text) + '</p></div>').join('') + '</section>';
  }
  h += upcoming(COST_RELEASES, 4);
  return h;
}

function setStatus(){
  const el = document.getElementById('status'), txt = document.getElementById('status-text');
  const n = (D.errors || []).length, age = (Date.now() - new Date(D.generated).getTime()) / 36e5;
  const g = new Date(D.generated);
  const when = MONTHS[g.getMonth()] + ' ' + g.getDate() + ' · ' + g.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'});
  el.classList.toggle('warn', n > 0 || age > 36);
  txt.textContent = n > 0 ? n + (n > 1 ? ' issues' : ' issue') + ' · ' + when : age > 36 ? 'Stale · ' + when : 'Updated ' + when;
  el.setAttribute('aria-label', 'Updated ' + when + (n ? ', ' + n + ' issues on the last run' : '') + '. Tap to refresh.');
}
function render(){
  if(!D) return;
  const hash = location.hash.replace(/^#/, '') || 'builders';
  let tab = hash, html;
  if(hash.startsWith('b/')){ tab = 'builders'; html = renderBuilder(decodeURIComponent(hash.slice(2))); }
  else if(hash === 'socal') html = renderSoCal();
  else if(hash === 'costs') html = renderCosts();
  else if(hash === 'macro') html = renderMacro();
  else { tab = 'builders'; html = renderBuilders(); }
  view.innerHTML = html;
  document.querySelectorAll('.tabs a').forEach(a => { if(a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  setStatus();
}
async function load(){
  try {
    const r = await fetch('../data.json', {cache: 'no-cache'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json();
    loadedAt = Date.now();
    render();
  } catch(e){
    if(!D) view.innerHTML = '<div class="loading">Could not load the board’s data. Check your connection and tap the status button to try again.</div>';
  }
}
let lastHash = location.hash;
window.addEventListener('hashchange', () => {
  const toDetail = location.hash.startsWith('#b/');
  render();
  if(toDetail || !lastHash.startsWith('#b/')) window.scrollTo(0, 0);
  lastHash = location.hash;
});
document.getElementById('status').addEventListener('click', load);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && Date.now() - loadedAt > 15 * 60 * 1000) load();
});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
load();
</script>
</body>
</html>
